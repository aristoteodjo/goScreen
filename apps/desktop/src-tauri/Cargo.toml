[package]
name = "goscreen"
version = "0.1.0"
description = "goScreen - device studio for product videos"
edition = "2021"

[lib]
name = "goscreen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "6"
which = "8"
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "deflate",
] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time"] }
trash = "5"
# Microphone capture without lost samples (FFmpeg's avfoundation drops some).
cpal = "0.15"
hound = "3.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Window-only capture: other apps' windows over goScreen never reach the video.
screencapturekit = { version = "10.0.3", features = ["macos_15_0"] }
libc = "0.2"
